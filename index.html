<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="曲のリズムに合わせて手拍子し、きゅうくらりん風の画像列をつなぐp5.jsリズムゲーム"
    />
    <meta name="theme-color" content="#f2eee7" />
    <title>きゅうくらりん Rhythm Archive</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f2eee7;
        color: #100f12;
        overscroll-behavior: none;
      }

      body {
        font-family: "Arial Narrow", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      }

      #app,
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      canvas {
        touch-action: none;
        outline: none;
      }

      .visually-hidden {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #audio-settings {
        position: fixed;
        z-index: 2;
        top: 15px;
        right: 180px;
        font-size: 12px;
      }

      #audio-settings summary {
        width: 58px;
        box-sizing: border-box;
        padding: 12px 8px;
        border: 1.5px solid #100f12;
        border-radius: 2px;
        background: #f2eee7;
        font-weight: bold;
        text-align: center;
        cursor: pointer;
        list-style: none;
      }

      #audio-settings summary::-webkit-details-marker {
        display: none;
      }

      .settings-panel {
        position: absolute;
        top: 48px;
        right: 0;
        width: min(260px, calc(100vw - 20px));
        box-sizing: border-box;
        padding: 14px;
        border: 1.5px solid #100f12;
        border-radius: 2px;
        background: #f2eee7;
        box-shadow: 4px 4px 0 #100f12;
      }

      .settings-panel label {
        display: grid;
        gap: 5px;
        margin-bottom: 12px;
        font-weight: bold;
      }

      .settings-panel label:last-child {
        margin-bottom: 0;
      }

      .settings-panel input,
      .settings-panel select {
        width: 100%;
        box-sizing: border-box;
      }

      @media (max-width: 719px), (max-height: 609px) {
        #audio-settings {
          top: 12px;
          right: 132px;
        }

        #audio-settings summary {
          padding: 10px 8px;
        }

        .settings-panel {
          top: 44px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="きゅうくらりんリズムゲーム"></main>
    <details id="audio-settings">
      <summary>設定</summary>
      <div class="settings-panel">
        <label>
          再生音量 <output id="volume-value">82%</output>
          <input id="playback-volume" type="range" min="0" max="100" value="82" />
        </label>
        <label>
          入力デバイス
          <select id="input-device"><option value="">既定のマイク</option></select>
        </label>
        <label>
          出力デバイス
          <select id="output-device"><option value="">既定の出力</option></select>
        </label>
      </div>
    </details>
    <input id="audio-file" type="file" accept="audio/*" class="visually-hidden" tabindex="-1" />
    <audio id="audio" preload="metadata"></audio>
    <div id="live-region" class="visually-hidden" aria-live="polite"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
